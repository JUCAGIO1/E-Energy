<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE033"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Plug Icon Badge -->
  <g transform="translate(10, 10)">
    <!-- Yellow Box Background -->
    <rect x="0" y="0" width="100" height="100" rx="14" fill="url(#goldGradient)" stroke="#0F1117" stroke-width="4"/>
    
    <!-- Plug prongs -->
    <rect x="33" y="16" width="6" height="15" rx="3" fill="#0F1117"/>
    <rect x="61" y="16" width="6" height="15" rx="3" fill="#0F1117"/>
    
    <!-- Plug Body -->
    <path d="M24 30 C24 27 27 25 30 25 L70 25 C73 25 76 27 76 30 L76 50 C76 64 64 73 50 73 C36 73 24 64 24 50 Z" 
          fill="#0F1117" stroke="#0F1117" stroke-width="2"/>
    
    <!-- Lightning inside plug -->
    <path d="M52 33 L42 47 L49 47 L47 62 L58 46 L51 46 Z" fill="url(#goldGradient)"/>
    
    <!-- Cord Loop below -->
    <path d="M50 73 C50 82 58 87 64 87 C71 87 75 82 75 76 C75 69 68 67 60 70 C48 74 30 75 14 75" 
          stroke="#0F1117" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Typography: E-ENERGY -->
  <g transform="translate(130, 20)">
    <text x="0" y="58" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="3">E-ENERGY</text>
    
    <!-- Underline bar with energy accent -->
    <rect x="2" y="68" width="265" height="4" rx="2" fill="#FFFFFF" opacity="0.9"/>
    <rect x="2" y="68" width="120" height="4" rx="2" fill="url(#goldGradient)"/>
  </g>

  <!-- Electric Bolt Icon Right -->
  <g transform="translate(425, 26)">
    <path d="M22 0 L4 34 L19 34 L12 60 L38 24 L22 24 Z" fill="url(#goldGradient)" filter="url(#glow)"/>
  </g>
</svg>
